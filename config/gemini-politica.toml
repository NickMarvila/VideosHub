# Permissões do Gemini CLI quando o painel chama a IA (equivalente ao --allowedTools do Claude).
# Lê e escreve arquivos do projeto, pesquisa na web e roda só os comandos de validar/renderizar do hub.

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rule]]
toolName = "read_many_files"
decision = "allow"
priority = 50

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rule]]
toolName = "glob"
decision = "allow"
priority = 50

[[rule]]
toolName = "grep_search"
decision = "allow"
priority = 50

[[rule]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rule]]
toolName = "google_web_search"
decision = "allow"
priority = 50

[[rule]]
toolName = "web_fetch"
decision = "allow"
priority = 50

[[rule]]
toolName = "write_file"
decision = "allow"
priority = 50

[[rule]]
toolName = "replace"
decision = "allow"
priority = 50

[[rule]]
toolName = "write_todos"
decision = "allow"
priority = 50

[[rule]]
toolName = "activate_skill"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node pipeline/cenas.mjs validar"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node Kit_Video_3d/tools/validar.mjs"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node Kit_Video_3d/tools/render.mjs"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node Kit_Video_3d/tools/novo-projeto.mjs"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node apps/render/render2d.mjs"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "node pipeline/biblioteca.mjs validar"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
commandPrefix = "npx tsc --noEmit -p apps/render"
decision = "allow"
priority = 50

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 40
denyMessage = "No VideosHub a IA só pode rodar os comandos de validar e renderizar do hub."
