<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- parede escura -->
  <rect x="0" y="0" width="1080" height="1370" fill="#1B1733"/>
  <rect x="0" y="1150" width="1080" height="220" fill="#16122B"/>
  <!-- faixa neon roxa no alto -->
  <rect x="0" y="300" width="1080" height="60" fill="#A855F7" opacity="0.18"/>
  <rect x="0" y="324" width="1080" height="12" fill="#C084FC"/>
  <!-- faixa neon azul no rodapé -->
  <rect x="0" y="1330" width="1080" height="44" fill="#38BDF8" opacity="0.2"/>
  <rect x="0" y="1346" width="1080" height="10" fill="#7DD3FC"/>
  <!-- tubo neon azul vertical na parede direita -->
  <rect x="1000" y="380" width="60" height="760" fill="#38BDF8" opacity="0.16"/>
  <rect x="1024" y="380" width="12" height="760" rx="6" fill="#7DD3FC"/>
  <!-- pôster central (sem texto) -->
  <rect x="440" y="390" width="200" height="270" fill="#2B2350" stroke="#1E2227" stroke-width="8"/>
  <circle cx="540" cy="490" r="58" fill="#F472B6"/>
  <polygon points="460,640 520,560 560,600 600,540 620,640" fill="#6D28D9"/>
  <!-- pôster esquerdo -->
  <rect x="50" y="430" width="160" height="220" fill="#0EA5E9" stroke="#1E2227" stroke-width="8"/>
  <polygon points="130,470 180,560 130,620 80,560" fill="#FDE047" stroke="#1E2227" stroke-width="6"/>
  <!-- pôster direito -->
  <rect x="850" y="430" width="140" height="200" fill="#7C3AED" stroke="#1E2227" stroke-width="8"/>
  <circle cx="900" cy="500" r="22" fill="#22D3EE"/>
  <circle cx="945" cy="560" r="30" fill="#F472B6"/>
  <!-- chão -->
  <rect x="0" y="1370" width="1080" height="550" fill="#231D3D"/>
  <rect x="0" y="1370" width="1080" height="14" fill="#2F2752"/>
  <ellipse cx="560" cy="1560" rx="420" ry="90" fill="#3B2F6B"/>
  <ellipse cx="560" cy="1560" rx="330" ry="60" fill="#4C3A8A"/>
  <!-- brilho dos monitores na parede -->
  <ellipse cx="170" cy="1040" rx="230" ry="150" fill="#38BDF8" opacity="0.14"/>
  <!-- mesa -->
  <rect x="-10" y="1150" width="340" height="30" fill="#2A2A35" stroke="#1E2227" stroke-width="8"/>
  <rect x="290" y="1180" width="22" height="210" fill="#2A2A35" stroke="#1E2227" stroke-width="6"/>
  <rect x="0" y="1170" width="330" height="8" fill="#A855F7"/>
  <!-- monitores -->
  <rect x="20" y="960" width="180" height="120" rx="6" fill="#111827" stroke="#1E2227" stroke-width="8"/>
  <rect x="32" y="972" width="156" height="96" fill="#38BDF8"/>
  <polygon points="40,1050 90,1000 130,1030 180,990 180,1060 40,1060" fill="#0369A1"/>
  <rect x="200" y="990" width="110" height="90" rx="6" fill="#111827" stroke="#1E2227" stroke-width="8"/>
  <rect x="210" y="1000" width="90" height="70" fill="#C084FC"/>
  <rect x="100" y="1080" width="20" height="70" fill="#374151"/>
  <rect x="245" y="1080" width="16" height="70" fill="#374151"/>
  <rect x="70" y="1132" width="140" height="18" rx="4" fill="#374151" stroke="#1E2227" stroke-width="5"/>
  <rect x="230" y="1136" width="30" height="14" rx="6" fill="#22D3EE"/>
  <!-- gabinete RGB sob a mesa -->
  <rect x="30" y="1210" width="110" height="180" rx="6" fill="#18181F" stroke="#1E2227" stroke-width="8"/>
  <rect x="44" y="1226" width="82" height="148" fill="#A855F7" opacity="0.55"/>
  <circle cx="85" cy="1270" r="24" fill="#22D3EE" stroke="#1E2227" stroke-width="5"/>
  <circle cx="85" cy="1335" r="24" fill="#F472B6" stroke="#1E2227" stroke-width="5"/>
  <!-- cadeira gamer -->
  <rect x="160" y="1090" width="130" height="230" rx="40" fill="#18181F" stroke="#1E2227" stroke-width="9"/>
  <rect x="200" y="1110" width="50" height="190" rx="18" fill="#A855F7"/>
  <rect x="150" y="1300" width="160" height="50" rx="20" fill="#18181F" stroke="#1E2227" stroke-width="9"/>
  <rect x="218" y="1350" width="22" height="90" fill="#374151" stroke="#1E2227" stroke-width="6"/>
  <rect x="160" y="1440" width="140" height="16" rx="8" fill="#374151" stroke="#1E2227" stroke-width="6"/>
  <circle cx="170" cy="1468" r="14" fill="#1E2227"/>
  <circle cx="290" cy="1468" r="14" fill="#1E2227"/>
  <!-- prateleira com luz na direita -->
  <rect x="850" y="1020" width="200" height="18" fill="#2A2A35" stroke="#1E2227" stroke-width="6"/>
  <rect x="870" y="960" width="40" height="60" fill="#22D3EE" stroke="#1E2227" stroke-width="5"/>
  <rect x="925" y="940" width="44" height="80" fill="#F472B6" stroke="#1E2227" stroke-width="5"/>
  <circle cx="1000" cy="995" r="24" fill="#FDE047" stroke="#1E2227" stroke-width="5"/>
</svg>
